name: Runner CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner:
    name: Ubuntu Runner
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Runner information
        run: |
          echo "Runner OS: ${RUNNER_OS}"
          uname -a
          echo "Repository: ${GITHUB_REPOSITORY}"
          echo "Commit: ${GITHUB_SHA}"
          ls -la
