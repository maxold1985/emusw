name: Build emusw Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore vcpkg binary cache
        uses: actions/cache@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}
          restore-keys: |
            vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Install vcpkg and NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          git clone https://github.com/microsoft/vcpkg.git externals/vcpkg
          git -C externals/vcpkg checkout a42af01b72c28a8e1d7b48107b33e4f286a55ef6
          & .\\externals\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          New-Item -ItemType Directory -Force .vcpkg-binary-cache | Out-Null
          nasm -v
          if (!(Test-Path externals/vcpkg/scripts/buildsystems/vcpkg.cmake)) { throw "vcpkg toolchain missing" }
          # Do not create a fake NASM ZIP. Chocolatey installs the real executable.
          # The obsolete optional NASM download in CMake may emit a warning.

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_QT=OFF `
            -DENABLE_SDL2=ON `
            -DENABLE_WEB_SERVICE=OFF `
            -DYUZU_TESTS=OFF `
            -DYUZU_ROOM=OFF `
            -DYUZU_USE_BUNDLED_VCPKG=ON `
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build -Recurse -File -Include *.exe,*.dll |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.FullName -notmatch '[\\/]CMakeFiles[\\/]' } |
            Copy-Item -Destination dist -Force
          if (-not (Get-ChildItem dist -Filter *.exe)) { throw 'No executable was generated.' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: emusw-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
