name: Build emusw Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-binary-cache,readwrite"
      VCPKG_KEEP_ENV_VARS: PKG_CONFIG
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Restore missing external source dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --depth 1 https://github.com/SnowZucc/yuzu-archive.git "$env:RUNNER_TEMP/yuzu-source"
          if ($LASTEXITCODE -ne 0) { throw "Failed to obtain original submodule manifest" }
          $modules = @(
            "externals/enet",
            "externals/cubeb",
            "externals/sirit",
            "externals/opus",
            "externals/Vulkan-Headers",
            "externals/Vulkan-Utility-Libraries",
            "externals/VulkanMemoryAllocator",
            "externals/simpleini",
            "externals/xbyak",
            "externals/dynarmic",
            "externals/mbedtls",
            "externals/libusb/libusb",
            "externals/discord-rpc",
            "externals/SDL",
            "externals/nx_tzdb/tzdb_to_nx"
          )
          git -C "$env:RUNNER_TEMP/yuzu-source" config -f .gitmodules submodule.sirit.url https://github.com/ReinUsesLisp/sirit.git
          git -C "$env:RUNNER_TEMP/yuzu-source" config -f .gitmodules submodule.dynarmic.url https://github.com/azahar-emu/dynarmic.git
          git -C "$env:RUNNER_TEMP/yuzu-source" config -f .gitmodules submodule.mbedtls.url https://github.com/Mbed-TLS/mbedtls.git
          git -C "$env:RUNNER_TEMP/yuzu-source" config -f .gitmodules submodule.discord-rpc.url https://github.com/discord/discord-rpc.git
          git -C "$env:RUNNER_TEMP/yuzu-source" submodule sync -- externals/sirit externals/dynarmic externals/mbedtls externals/discord-rpc
          foreach ($module in $modules) {
            git -C "$env:RUNNER_TEMP/yuzu-source" submodule update --init --depth 1 -- $module
            if ($LASTEXITCODE -ne 0) { throw "Unable to restore $module from archived submodule revision" }
            if ($module -eq "externals/sirit") {
              git -C "$env:RUNNER_TEMP/yuzu-source/$module" submodule update --init --recursive --depth 1
              if ($LASTEXITCODE -ne 0) { throw "Unable to restore sirit nested SPIRV-Headers submodule" }
              if (!(Test-Path "$env:RUNNER_TEMP/yuzu-source/$module/externals/SPIRV-Headers/CMakeLists.txt")) { throw "SPIRV-Headers CMakeLists.txt missing in sirit" }
            }
            if ($module -eq "externals/cubeb") {
              git -C "$env:RUNNER_TEMP/yuzu-source/$module" submodule update --init --recursive --depth 1 -- cmake/sanitizers-cmake
              if ($LASTEXITCODE -ne 0) { throw "Unable to restore cubeb sanitizers-cmake nested submodule" }
              if (!(Test-Path "$env:RUNNER_TEMP/yuzu-source/$module/cmake/sanitizers-cmake/cmake/FindSanitizers.cmake")) { throw "cubeb FindSanitizers.cmake missing after nested submodule checkout" }
            }
            if (!(Test-Path "$env:RUNNER_TEMP/yuzu-source/$module/CMakeLists.txt") -and $module -notmatch 'simpleini|xbyak|tzdb_to_nx|libusb/libusb') {
              throw "Submodule missing CMakeLists.txt: $module"
            }
            New-Item -ItemType Directory -Force (Split-Path $module -Parent) | Out-Null
            Copy-Item "$env:RUNNER_TEMP/yuzu-source/$module" -Destination $module -Recurse -Force
          }

      - name: Install glslangValidator
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP "glslang.zip"
          $folder = Join-Path $env:RUNNER_TEMP "glslang-tools"
          Invoke-WebRequest "https://github.com/KhronosGroup/glslang/releases/download/8.13.3559/glslang-master-windows-x64-Release.zip" -OutFile $archive
          Expand-Archive $archive -DestinationPath $folder -Force
          $validator = Get-ChildItem $folder -Filter glslangValidator.exe -Recurse -File | Select-Object -First 1 -ExpandProperty FullName
          if (-not $validator) { throw "glslangValidator.exe missing from release archive" }
          $validatorDir = Split-Path $validator -Parent
          $validatorDir >> $env:GITHUB_PATH
          & $validator --version
          if ($LASTEXITCODE -ne 0) { throw "glslangValidator execution failed" }

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-

      - name: Install vcpkg and NASM
        shell: pwsh
        run: |
          choco install nasm -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "Chocolatey NASM installation failed" }
          $nasmPaths = @(
            "C:\\Program Files\\NASM\\nasm.exe",
            "C:\\Program Files (x86)\\NASM\\nasm.exe",
            "C:\\tools\\nasm\\nasm.exe",
            "C:\\ProgramData\\chocolatey\\bin\\nasm.exe"
          )
          $nasmExe = $nasmPaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $nasmExe) { throw "NASM executable not found after Chocolatey installation" }
          $nasmDir = Split-Path $nasmExe -Parent
          $env:PATH = "$nasmDir;$env:PATH"
          $nasmDir >> $env:GITHUB_PATH
          & $nasmExe -v
          git clone https://github.com/microsoft/vcpkg.git externals/vcpkg
          git -C externals/vcpkg checkout e456309491fd875487bf02b8a0dca76c1b1b00cc
          & .\\externals\\vcpkg\\bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed" }
          New-Item -ItemType Directory -Force .vcpkg-binary-cache | Out-Null
          if (!(Test-Path externals/vcpkg/scripts/buildsystems/vcpkg.cmake)) { throw "vcpkg toolchain missing" }
          # Do not create a fake NASM ZIP. Chocolatey installs the real executable.
          # The obsolete optional NASM download in CMake may emit a warning.

      - name: Install pkg-config for vcpkg
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "pkgconfiglite installation failed" }
          $candidatePaths = @(
            "C:\\ProgramData\\chocolatey\\bin\\pkg-config.exe",
            "C:\\ProgramData\\chocolatey\\lib\\pkgconfiglite\\tools\\pkg-config.exe"
          )
          $pkgConfig = $candidatePaths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $pkgConfig) {
            $pkgConfig = Get-ChildItem "C:\\ProgramData\\chocolatey\\lib\\pkgconfiglite" -Recurse -Filter pkg-config.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $pkgConfig) { throw "pkg-config.exe not found after installation" }
          & $pkgConfig --version
          if ($LASTEXITCODE -ne 0) { throw "pkg-config is not executable" }
          "PKG_CONFIG=$pkgConfig" >> $env:GITHUB_ENV
          "VCPKG_KEEP_ENV_VARS=PKG_CONFIG" >> $env:GITHUB_ENV
          Write-Host "pkg-config configured for vcpkg build environment: $pkgConfig"

      - name: Install FFmpeg development libraries
        shell: pwsh
        run: |
          & .\\externals\\vcpkg\\vcpkg.exe install --triplet x64-windows
          if ($LASTEXITCODE -ne 0) { throw "FFmpeg installation failed" }
          $ffmpegInclude = Join-Path (Get-Location) "vcpkg_installed/x64-windows/include"
          if (!(Test-Path (Join-Path $ffmpegInclude "libavcodec/avcodec.h"))) { throw "FFmpeg avcodec header missing" }
          if (!(Test-Path (Join-Path $ffmpegInclude "libswscale/swscale.h"))) { throw "FFmpeg swscale header missing" }
          "FFMPEG_DIR=$(Join-Path (Get-Location) 'vcpkg_installed/x64-windows')" >> $env:GITHUB_ENV

      - name: Install Qt5 for MSVC 2022
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: windows
          target: desktop
          arch: win64_msvc2019_64
          modules: 'qtmultimedia'
          cache: true

      - name: Restore incremental CMake build cache
        uses: actions/cache/restore@v4
        with:
          path: build
          key: cmake-msvc2022-release-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', '.github/workflows/runner.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            cmake-msvc2022-release-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', '.github/workflows/runner.yml') }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_QT=ON `
            -DENABLE_QT6=OFF `
            -DYUZU_USE_BUNDLED_QT=OFF `
            -DCMAKE_PREFIX_PATH="$env:Qt5_DIR/../../.." `
            -DENABLE_SDL2=ON `
            -DYUZU_USE_BUNDLED_SDL2=OFF `
            -DENABLE_WEB_SERVICE=OFF `
            -DYUZU_CHECK_SUBMODULES=OFF `
            -DYUZU_USE_BUNDLED_FFMPEG=OFF `
            -DYUZU_TESTS=OFF `
            -DYUZU_ROOM=OFF `
            -DYUZU_USE_BUNDLED_VCPKG=ON `
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD

      - name: Verify Qt5 configuration
        shell: pwsh
        run: |
          if (!(Test-Path "$env:Qt5_DIR/Qt5Config.cmake")) { throw "Qt5Config.cmake missing at $env:Qt5_DIR" }
          Write-Host "Qt5 location: $env:Qt5_DIR"

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }

      - name: Save incremental CMake build cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: build
          key: cmake-msvc2022-release-${{ hashFiles('CMakeLists.txt', 'vcpkg.json', '.github/workflows/runner.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .vcpkg-binary-cache
          key: vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $gui = Get-ChildItem build/src/yuzu -Recurse -Filter yuzu.exe -File |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if (-not $gui) { throw 'Qt GUI executable yuzu.exe was not generated.' }
          Copy-Item (Join-Path $gui.DirectoryName '*') -Destination dist -Recurse -Force
          $cmd = Get-ChildItem build/src/yuzu_cmd -Recurse -Filter yuzu-cmd.exe -File -ErrorAction SilentlyContinue |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' } |
            Select-Object -First 1
          if ($cmd) { Copy-Item $cmd.FullName -Destination dist -Force }
          if (!(Test-Path dist/yuzu.exe)) { throw 'Qt frontend missing from distribution.' }
          $deploy = Join-Path $env:QT_ROOT_DIR 'bin/windeployqt.exe'
          if (!(Test-Path $deploy)) { throw "windeployqt.exe not found: $deploy" }
          & $deploy --release --no-translations --no-compiler-runtime (Join-Path (Resolve-Path dist).Path 'yuzu.exe')
          if ($LASTEXITCODE -ne 0) { throw 'windeployqt failed' }
          if (!(Test-Path dist/platforms/qwindows.dll)) { throw 'Qt Windows platform plugin qwindows.dll missing.' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: emusw-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
