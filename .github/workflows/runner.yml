name: Build emusw Windows

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64

      - name: Set up vcpkg cache
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DENABLE_QT=OFF `
            -DENABLE_SDL2=ON `
            -DENABLE_WEB_SERVICE=OFF `
            -DYUZU_TESTS=OFF `
            -DYUZU_ROOM=OFF `
            -DYUZU_USE_BUNDLED_VCPKG=ON

      - name: Build Release
        shell: pwsh
        run: cmake --build build --config Release --parallel 2

      - name: Collect executables
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build -Recurse -File -Include *.exe,*.dll |
            Where-Object { $_.FullName -match '[\\/]Release[\\/]' -and $_.FullName -notmatch '[\\/]CMakeFiles[\\/]' } |
            Copy-Item -Destination dist -Force
          if (-not (Get-ChildItem dist -Filter *.exe)) { throw 'No executable was generated.' }

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: emusw-windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 7
